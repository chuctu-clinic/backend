spring:
  application:
    name: clinic
  config:
    # Đọc .env cạnh project (định dạng KEY=VALUE). Biến môi trường của hệ điều hành được ưu tiên hơn.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:4000}
  # Tin một lớp proxy (X-Forwarded-*), tương đương app.set('trust proxy', 1)
  forward-headers-strategy: framework
  tomcat:
    # Khi trả lỗi mà chưa đọc hết body (ví dụ ảnh quá 3 MB hay body không phải ảnh gửi tới /api/admin/uploads), Tomcat đọc bỏ phần
    # thừa tới giới hạn này rồi mới đóng kết nối; mặc định 2 MB thì máy khách gửi 3 đến 8 MB bị ngắt trước khi nhận được phản hồi lỗi.
    max-swallow-size: 8MB
